name: Release

# Запускается при отправке тега вида v1.2.3:
#   git tag v1.2.3 && git push origin v1.2.3
# Собирает бинарники под все платформы и прикладывает их к релизу на GitHub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # можно собрать вручную, релиз при этом не создаётся

permissions:
  contents: write # нужно, чтобы создать релиз и загрузить файлы

jobs:
  build:
    name: Сборка релиза
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Тесты прогоняются и здесь: тег может быть поставлен на коммит,
      # который не проходил CI.
      - name: Тесты
        run: go test ./... -race -count=1

      # Единственный источник номера версии — имя тега. Ни versioninfo.json,
      # ни исходники руками править не нужно.
      - name: Разобрать версию из тега
        id: ver
        run: |
          raw="${GITHUB_REF_NAME}"
          if [[ ! "$raw" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Ручной запуск или нестандартный тег — версия нулевая, релиз не создаётся.
            echo "full=$raw" >> "$GITHUB_OUTPUT"
            echo "num=0.0.0" >> "$GITHUB_OUTPUT"
            echo "major=0"   >> "$GITHUB_OUTPUT"
            echo "minor=0"   >> "$GITHUB_OUTPUT"
            echo "patch=0"   >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n="${raw#v}"
          # full — с префиксом (v1.2.3), num — без него: goversioninfo принимает
          # в строковые поля только запись вида x.y.z.
          echo "full=$raw"                        >> "$GITHUB_OUTPUT"
          echo "num=$n"                           >> "$GITHUB_OUTPUT"
          echo "major=${n%%.*}"                   >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$n" | cut -d. -f2)" >> "$GITHUB_OUTPUT"
          echo "patch=$(echo "$n" | cut -d. -f3)" >> "$GITHUB_OUTPUT"

      - name: Установить goversioninfo
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0

      # Иконка и свойства файла для Windows. Номера версий передаются флагами,
      # поэтому в свойствах exe оказывается ровно то, что в теге.
      - name: Ресурсы Windows (amd64)
        run: |
          cd cmd/booster
          "$(go env GOPATH)/bin/goversioninfo" \
            -icon=favicon.ico -manifest=booster.exe.manifest -64=true \
            -ver-major=${{ steps.ver.outputs.major }} \
            -ver-minor=${{ steps.ver.outputs.minor }} \
            -ver-patch=${{ steps.ver.outputs.patch }} \
            -ver-build=0 \
            -product-ver-major=${{ steps.ver.outputs.major }} \
            -product-ver-minor=${{ steps.ver.outputs.minor }} \
            -product-ver-patch=${{ steps.ver.outputs.patch }} \
            -product-ver-build=0 \
            -file-version="${{ steps.ver.outputs.num }}" \
            -product-version="${{ steps.ver.outputs.num }}"

      - name: Сборка Windows amd64
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -buildid= -X main.version=${{ steps.ver.outputs.full }}" \
            -o dist/booster.exe ./cmd/booster

      - name: Ресурсы Windows (x86)
        run: |
          cd cmd/booster
          "$(go env GOPATH)/bin/goversioninfo" \
            -icon=favicon.ico -manifest=booster.exe.manifest -64=false \
            -ver-major=${{ steps.ver.outputs.major }} \
            -ver-minor=${{ steps.ver.outputs.minor }} \
            -ver-patch=${{ steps.ver.outputs.patch }} \
            -ver-build=0 \
            -product-ver-major=${{ steps.ver.outputs.major }} \
            -product-ver-minor=${{ steps.ver.outputs.minor }} \
            -product-ver-patch=${{ steps.ver.outputs.patch }} \
            -product-ver-build=0 \
            -file-version="${{ steps.ver.outputs.num }}" \
            -product-version="${{ steps.ver.outputs.num }}"

      - name: Сборка Windows 386
        run: |
          GOOS=windows GOARCH=386 go build -trimpath \
            -ldflags="-s -w -buildid= -X main.version=${{ steps.ver.outputs.full }}" \
            -o dist/booster-x86.exe ./cmd/booster

      # Windows-ресурс ломает линковку под Linux и macOS — убираем.
      - name: Убрать ресурс Windows
        run: rm -f cmd/booster/resource.syso

      - name: Сборка остальных платформ
        run: |
          set -e
          build() {
            GOOS=$1 GOARCH=$2 go build -trimpath \
              -ldflags="-s -w -buildid= -X main.version=${{ steps.ver.outputs.full }}" \
              -o "dist/$3" ./cmd/booster
            echo "собрано: $3"
          }
          build linux  amd64 booster-linux-amd64
          build linux  arm64 booster-linux-arm64
          build linux  386   booster-linux-386
          build darwin amd64 booster-macos-amd64
          build darwin arm64 booster-macos-arm64

      - name: Контрольные суммы
        # Именно booster*, а не *: перенаправление создаёт SHA256SUMS.txt
        # раньше раскрытия шаблона, и файл посчитал бы сам себя.
        run: cd dist && sha256sum booster* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: booster-${{ github.ref_name }}
          path: dist/

      # Публикация. Поддерживаются оба способа выпуска:
      #
      #  1. Тег отправлен из VS Code или командной строки — релиза ещё нет,
      #     создаём его сами и генерируем описание из коммитов.
      #  2. Релиз создан вручную на сайте GitHub (тег при этом создаётся
      #     автоматически) — релиз уже существует, поэтому только прикладываем
      #     файлы. Описание, написанное руками, не трогаем.
      #
      # Без этой развилки второй способ ронял бы сборку: gh release create
      # возвращает ошибку, если релиз с таким тегом уже есть.
      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Релиз ${GITHUB_REF_NAME} уже существует — прикладываем файлы."
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            echo "Создаём релиз ${GITHUB_REF_NAME}."
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi

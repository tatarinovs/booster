name: CI

# Запускается на каждый push в main и на каждый pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # позволяет запустить вручную из вкладки Actions

permissions:
  contents: read

jobs:
  check:
    name: Проверки и тесты (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Форматирование (gofmt)
        run: |
          unformatted=$(gofmt -l ./cmd)
          if [ -n "$unformatted" ]; then
            echo "Эти файлы не отформатированы — выполните: gofmt -w ./cmd"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Тесты с детектором гонок
        run: go test ./... -race -count=1

      - name: Покрытие
        run: go test ./... -count=1 -coverprofile=coverage.out && go tool cover -func=coverage.out | tail -1

  test-windows:
    name: Тесты (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Основная платформа проекта: здесь работает terminal_windows.go,
      # запрещённые символы в именах файлов и повторные попытки удаления.
      # Без -race: детектор гонок на Windows требует внешний компилятор C,
      # а гонки всё равно ловятся в задаче на Linux.
      - name: Тесты
        run: go test ./... -count=1

  build:
    name: Сборка ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: "386" }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: "386" }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Сборка
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w -buildid=" -o /dev/null ./cmd/booster
